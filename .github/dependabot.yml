# Weekly pull requests for security fixes and updates of the locked dependencies and the
# GitHub Actions the workflows use. Each one still has to pass CI before it is merged.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
