# Aircraft and camera profiles: the DJI camera drones with native waypoint flight (DJI's list of
# waypoint drones; waypointmap.com supported drones), RGB camera only.
# Every value states its source; `verified = false` means it has not yet been confirmed on real
# hardware for this project. Confirm camera values from an original photo with:
#   divi camera-from-photo
#
# waypoint_limit: DJI Fly's own limit per mission. It warns above 200 (seen in DJI Fly on a
#   508-waypoint mission, 2026-11-13), so Dīvi never writes more; a longer plan is split.
# mission_app: where a waypoint mission for this drone is flown.
#   "dji-fly"     DJI Fly waypoint flight (Dīvi writes these missions)
#   "waypoint-pro" a drone whose waypoints are flown in another app (none listed now); Dīvi cannot
#                  write those missions
# mechanical_shutter: a global (mechanical) shutter has no rolling-shutter skew; readout_s is
#   then a token 0.001 s so the speed rule ignores it.
# Sensor sizes marked "35 mm equivalent" are not the real sensor: with the 35 mm-equivalent
#   focal length they give exactly the same ground resolution and photo footprint (only the
#   ratio sensor size / focal length matters), and DJI does not publish the real focal length.

[mavic-4-pro]
name = "DJI Mavic 4 Pro (and 512GB)"
# camera_model: not yet seen in a real photo
max_speed_ms = 25.0            # DJI spec top speed; waypoint missions may be slower
drone_enum = 68                # DJI Fly waypoint missions share one value (FlyPath plugin notes)
waypoint_limit = 200
mission_app = "dji-fly"
mechanical_shutter = false
verified = false
notes = "Hasselblad 4/3 100 MP, 28 mm equivalent, FOV 72 deg, 12288x8192 (DJI spec sheet). Top speed 25 m/s (S mode). Waypoint flight in DJI Fly."

[mavic-4-pro.modes.25mp]
sensor_width_mm = 36.0        # 35 mm equivalent (see the top of this file)
sensor_height_mm = 24.0
focal_mm = 28.0
image_width_px = 6144
image_height_px = 4096
min_interval_s = 2.0           # assumed; measure with a probe flight
readout_s = 0.03

[mavic-4-pro.modes.100mp]
sensor_width_mm = 36.0        # 35 mm equivalent (see the top of this file)
sensor_height_mm = 24.0
focal_mm = 28.0
image_width_px = 12288
image_height_px = 8192
min_interval_s = 7.0           # assumed; measure with a probe flight
readout_s = 0.03

